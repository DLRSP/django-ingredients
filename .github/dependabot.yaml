# https://docs.github.com/en/github/administering-a-repository/configuration-options-for-dependency-updates
---
version: 2
updates:

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    # Version-update PRs disabled fleet-wide: runtime/dev/test versions are
    # managed centrally by the pip-compile lock-regeneration flow
    # (upgrade-dependency.yaml). Per-package Dependabot version PRs only created
    # stale, unmergeable noise that conflicted with the hashed locks. Dependabot
    # SECURITY updates and alerts are unaffected by this limit (AR-033 SCA).
    open-pull-requests-limit: 0
    labels:
      - "📦 dependencies"
    assignees:
      - "dlrsp-dev"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "📦 dependencies"
    assignees:
      - "dlrsp-dev"
    ignore:
      # DLRSP reusable workflows are pinned to @main fleet-wide
      # (registry defaults.workflow_pin_target). Do not open version-pin
      # bump PRs for them — they only create stale, unmergeable noise.
      - dependency-name: "DLRSP/workflows*"
